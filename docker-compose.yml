services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/smartforge.db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - smartforge-data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  smartforge-data:
